<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>ShowGrid · Sin conexión</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #f2f2f3;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: #8e8e96; margin: 0 0 6px; }
  .links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  a, button { font: inherit; color: #0a0a0b; background: #fff; border: 0; border-radius: 8px; padding: 10px 16px; text-decoration: none; cursor: pointer; }
  a.ghost { background: #1c1c1f; color: #f2f2f3; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>Sin conexión · You're offline</h1>
  <p>Esta página todavía no está guardada en este equipo. Las herramientas que ya abriste funcionan sin internet.</p>
  <p>This page isn't saved on this device yet. Tools you've opened before work without internet.</p>
  <div class="links">
    <button onclick="location.reload()">Reintentar · Retry</button>
    <a class="ghost" href="/tools">Herramientas · Tools</a>
  </div>
</main>
</body>
</html>
